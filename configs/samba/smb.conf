# Configuração efetiva obtida com: testparm -s
[global]
    disable netbios = Yes
    server min protocol = SMB3
    server role = standalone server
    smb ports = 445
    workgroup = ESCRITORIO
    idmap config * : backend = tdb

[ti]
    create mask = 0660
    directory mask = 02770
    path = /srv/samba/ti
    read only = No
    valid users = @gestao

[financeiro]
    create mask = 0660
    directory mask = 02770
    path = /srv/samba/financeiro
    read only = No
    valid users = @financeiro

[staff]
    create mask = 0660
    directory mask = 02770
    path = /srv/samba/staff
    read only = No
    valid users = @staff

[geral]
    create mask = 0664
    directory mask = 02775
    path = /srv/samba/geral
    valid users = @gestao @financeiro @staff
    write list = @gestao
