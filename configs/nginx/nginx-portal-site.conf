server {
    listen 80;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/portal.crt;
    ssl_certificate_key /etc/nginx/tls/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 403;
    }
    location = / {
        include /etc/nginx/portal-glpi-proxy.conf;
    }
    location ~ ^/(index\.php$|Helpdesk(/|$)|ServiceCatalog(/|$)|Form/|front/(itilfollowup\.form|login|logout|locale|ticket|ticket\.form)\.php$|ajax/(common\.tabs|getDropdownValue|timeline|updatecurrenttab)\.php$|build/|css_compiled/|css/|js/|lib/|pics/) {
        include /etc/nginx/portal-glpi-proxy.conf;
    }
}
